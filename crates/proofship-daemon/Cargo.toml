[package]
name = "proofship-daemon"
version = "0.1.0"
edition = "2024"
description = "Headless ProofShip provider daemon"
license = "GPL-3.0-only"
readme = "README.md"

[features]
dev-binary = []

[[bin]]
name = "proofship-daemon"
path = "src/main.rs"

[[bin]]
name = "proofship-debug-daemon"
path = "src/bin/proofship-debug-daemon.rs"
required-features = ["dev-binary"]

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
proofship-core = { path = "../proofship-core" }
proofship-protocol = { path = "../proofship-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
