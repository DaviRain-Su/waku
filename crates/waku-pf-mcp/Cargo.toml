[package]
name = "waku-pf-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "ProofForge gate as an MCP server (stdio)"

[[bin]]
name = "waku-pf-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-std"] }

[dev-dependencies]
tempfile = "3"
